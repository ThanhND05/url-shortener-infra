name: Deploy AWS Lab
on:
  workflow_dispatch:
    inputs:
      backend_image:
        description: Backend GHCR digest reference
        required: true
      frontend_image:
        description: Frontend GHCR digest reference
        required: true
permissions:
  contents: read
concurrency:
  group: aws-lab-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aws-lab
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate release references
        env:
          BE_IMAGE: ${{ inputs.backend_image }}
          FE_IMAGE: ${{ inputs.frontend_image }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^ghcr.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$'
          [[ "$BE_IMAGE" =~ $pattern && "$FE_IMAGE" =~ $pattern ]]
          printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\n' "$BE_IMAGE" "$FE_IMAGE" > candidate.env
      - name: Configure AWS credentials from IAM user keys
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Open SSH only for this runner
        id: firewall
        env:
          SG_ID: ${{ vars.AWS_SG_ID }}
        shell: bash
        run: |
          set -euo pipefail
          runner_ip=$(curl --fail --silent https://checkip.amazonaws.com)
          IFS=. read -r -a octets <<< "$runner_ip"
          [[ ${#octets[@]} == 4 ]]
          for octet in "${octets[@]}"; do
            [[ "$octet" =~ ^[0-9]{1,3}$ ]]
            (( 10#$octet <= 255 ))
          done
          rule_id=$(aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "$runner_ip/32" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' --output text)
          echo "rule_id=$rule_id" >> "$GITHUB_OUTPUT"
      - name: Prepare verified SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lab_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/lab_key ~/.ssh/known_hosts
      - name: Upload config and deploy
        env:
          VM_HOST: ${{ vars.VM_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/lab_key -o StrictHostKeyChecking=yes -r compose scripts "ubuntu@$VM_HOST:/opt/url-shortener/"
          scp -i ~/.ssh/lab_key -o StrictHostKeyChecking=yes candidate.env "ubuntu@$VM_HOST:/opt/url-shortener/candidate.env"
          ssh -i ~/.ssh/lab_key -o StrictHostKeyChecking=yes "ubuntu@$VM_HOST" \
            'bash /opt/url-shortener/scripts/deploy.sh /opt/url-shortener/candidate.env'
      - name: Remove runner SSH rule
        if: always() && steps.firewall.outputs.rule_id != ''
        env:
          SG_ID: ${{ vars.AWS_SG_ID }}
          RULE_ID: ${{ steps.firewall.outputs.rule_id }}
        run: aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --security-group-rule-ids "$RULE_ID"
      - name: Remove runner key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/lab_key

