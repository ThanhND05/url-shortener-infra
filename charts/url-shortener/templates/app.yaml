apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: app
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: {{ required "Supply backendImage digest" .Values.backendImage | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 8081}
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: {{ .Values.existingSecret }}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '1', memory: 1536Mi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: app
spec:
  selector: {app: backend}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: management, port: 8081, targetPort: management}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ required "Supply frontendImage digest" .Values.frontendImage | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 80}
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: nginx
          configMap: {name: nginx-config}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: frontend
  {{- with .Values.frontend.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.frontend.serviceType }}
  {{- with .Values.frontend.loadBalancerClass }}
  loadBalancerClass: {{ . | quote }}
  {{- end }}
  {{- with .Values.frontend.sourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector: {app: frontend}
  ports:
    {{- if .Values.frontend.tls }}
    - {name: https, port: 443, targetPort: http}
    {{- else }}
    - {name: http, port: 80, targetPort: http}
    {{- end }}
