apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: app-config
data:
  SPRING_PROFILES_ACTIVE: lab
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
  FRONTEND_URL: {{ .Values.publicUrl | quote }}
  ALLOWED_ORIGINS: {{ .Values.publicUrl | quote }}
  VNPAY_RETURN_URL: {{ printf "%s/api/v1/billing/vnpay-return" .Values.publicUrl | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: nginx-config
data:
  default.conf: |
{{- if .Values.frontend.tls }}
{{ .Files.Get "files/nginx.conf" | replace "default $scheme;" "default https;" | indent 4 }}
{{- else }}
{{ .Files.Get "files/nginx.conf" | indent 4 }}
{{- end }}
