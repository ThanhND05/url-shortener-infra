server {
    listen 80;
    root /usr/share/nginx/html;
    location = /healthz { proxy_pass http://restore-app:8081/actuator/health; }
    location /api/ { proxy_pass http://restore-app:8080; }
    location /r/ { proxy_pass http://restore-app:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
