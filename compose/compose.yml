name: urlshortener
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?required}
      POSTGRES_USER: ${DB_USERNAME:?required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging
  redis:
    image: redis:7.2-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *logging
  kafka-init:
    image: busybox:1.37
    user: "0:0"
    command: [sh, -c, 'chown -R 1000:1000 /data']
    volumes:
      - kafka_data:/data
    restart: "no"
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *logging
  app:
    image: ${BACKEND_IMAGE:?required}
    environment:
      SPRING_PROFILES_ACTIVE: lab
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?required}
      DB_USERNAME: ${DB_USERNAME:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?required}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?required}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      FRONTEND_URL: ${FRONTEND_URL:?required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?required}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:?required}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:?required}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:?required}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    mem_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:8081/actuator/health | grep -q ''"status":"UP"''']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: unless-stopped
    logging: *logging
  frontend:
    image: ${FRONTEND_IMAGE:?required}
    ports:
      - ${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1/healthz | grep -q ''"status":"UP"''']
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped
    logging: *logging
volumes:
  postgres_data:
  redis_data:
  kafka_data:
