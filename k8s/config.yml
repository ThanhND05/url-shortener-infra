apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: urlshortener
data:
  SPRING_PROFILES_ACTIVE: lab
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  FRONTEND_URL: http://localhost:8080
  ALLOWED_ORIGINS: http://localhost:8080
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
